name: Deploy Japs_CRM to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build approved public policies and redirect
        run: node scripts/build-github-pages.mjs

      - name: Upload public pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .github-pages-dist

      - name: Deploy public policies and redirect to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
