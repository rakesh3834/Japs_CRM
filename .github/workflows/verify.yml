name: Verify Japs CRM

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm test
      - name: Install isolated PostgreSQL test runtime
        run: sudo apt-get update && sudo apt-get install -y postgresql
      - name: Verify migrations and concurrent ingestion
        run: JAPS_TEST_PG_BIN="$(pg_config --bindir)" node scripts/test-database.mjs
      - run: npm run build
